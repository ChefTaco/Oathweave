name: Release image
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-image
  cancel-in-progress: false
env:
  IMAGE: ghcr.io/cheftaco/oathweave
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
  build:
    needs: gates
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.result.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.result.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.licenses=Apache-2.0
      - id: result
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the multi-architecture image
        id: manifest
        env:
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          ARM64: ${{ needs.build.outputs.digest-arm64 }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if docker buildx imagetools inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "Refusing to overwrite $IMAGE:$version" >&2; exit 1
          fi
          docker buildx imagetools create --tag "$IMAGE:$version" "$IMAGE@$AMD64" "$IMAGE@$ARM64"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Record the digest in a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Image: \`$IMAGE@$DIGEST\`"
