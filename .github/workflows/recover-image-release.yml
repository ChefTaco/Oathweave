name: Recover image release metadata
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable source tag
        required: true
      expected_digest:
        description: Exact index digest from the original build
        required: true
      build_run:
        description: Original release-image workflow run ID
        required: true
permissions:
  contents: read
concurrency:
  group: release-image
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify the original build and immutable image
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node --test scripts/recover-image-release.test.mjs
          node scripts/recover-image-release.mjs
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-name: ghcr.io/cheftaco/oathweave
          subject-digest: ${{ steps.verified.outputs.digest }}
          push-to-registry: true
      - name: Record the existing image in the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verified.outputs.tag }}
          DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Image: ghcr.io/cheftaco/oathweave@$DIGEST. Provenance recovered after the original image build succeeded."
