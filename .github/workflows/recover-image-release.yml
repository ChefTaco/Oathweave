name: Recover image release metadata
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable source tag
        required: true
      expected_digest:
        description: Exact index digest from the original build
        required: true
      build_run:
        description: Original release-image workflow run ID
        required: true
permissions:
  contents: read
concurrency:
  group: release-image
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Verify the original build and immutable image
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_DIGEST: ${{ inputs.expected_digest }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          node --test scripts/recover-image-release.test.mjs
          node scripts/recover-image-release.mjs
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ghcr.io/cheftaco/oathweave
          subject-digest: ${{ steps.verified.outputs.digest }}
          push-to-registry: true
      - name: Record the existing image in the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.verified.outputs.tag }}
          DIGEST: ${{ steps.verified.outputs.digest }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Image: ghcr.io/cheftaco/oathweave@$DIGEST. Provenance recovered after the original image build succeeded."
