title = "Repository secret scanning"

[extend]
useDefault = true

# Global allowlists that list paths must also set targetRules. Without it, a matching path
# skips the whole file regardless of `condition`, which would hide any other secret in it.
# With targetRules, only the exact reviewed value in that file is excused.

[[allowlists]]
description = "Public scrypt domain-separation salt, not a credential."
condition = "AND"
targetRules = ["generic-api-key"]
regexTarget = "secret"
paths = ['''^apps/iam\-core/src/services/enrollment\-cipher\.ts$''']
regexes = ['''^oathweave\-enrollment\-receipt\-v1$''']
